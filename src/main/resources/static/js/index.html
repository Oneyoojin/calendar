<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>할 일 목록</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <script th:src="@{/js/index.js}" defer></script>
</head>
<body>

    <div th:fragment="body">
        <!-- 점 3개 클릭 시 나타나는 모달 -->
        <div id="taskMenuModal" class="modal" style="display: none;">
            <ul class="task-menu">
                <li class="selected">✔ 내가 정렬한 대로</li>
                <li>날짜</li>
                <li>최근 별표표시한 항목</li>
                <hr>
                <li>목록 이름 변경</li>
                <li class="disabled">목록 삭제 <span>기본 목록은 삭제할 수 없음</span></li>
                <hr>
                <li>목록 인쇄</li>
                <li>완료된 할 일 모두 삭제</li>
                <li class="disabled">오래된 할 일 정리</li>
            </ul>
        </div>
    </div>

    <!-- ✅ JavaScript를 이용한 `taskMenuModal` 표시 기능 -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const dotIcon = document.querySelector(".dot-icon");
            const taskMenuModal = document.getElementById("taskMenuModal");

            if (dotIcon) {
                dotIcon.addEventListener("click", function () {
                    if (taskMenuModal.style.display === "none" || taskMenuModal.style.display === "") {
                        taskMenuModal.style.display = "block";
                    } else {
                        taskMenuModal.style.display = "none";
                    }
                });

                // ✅ 모달 외부 클릭 시 닫기
                document.addEventListener("click", function (event) {
                    if (!taskMenuModal.contains(event.target) && !dotIcon.contains(event.target)) {
                        taskMenuModal.style.display = "none";
                    }
                });
            }
        });
    </script>

</body>
</html>
