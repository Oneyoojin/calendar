<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calender Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/find-username2.css}">
</head>
<body class="flex flex-col items-center min-h-screen py-10">
    
    <!-- 로고 (CSS에서 스타일 적용) -->
    <div class="logo">
        <img th:src="@{/images/icon.png}" alt="Calender Logo">
    </div>

    <!-- 입력 필드 -->
    <form th:action="@{/api/sample/find-username2}" method="post" class="w-full max-w-lg px-6">
        
        <div class="grid grid-cols-2 gap-4 mb-4">
            <input type="text" placeholder="생년월일" name="birthdate" th:value="${birthdate}" required 
                   class="w-full p-3 text-center bg-gray-200 rounded-md">
            <input type="text" placeholder="이름" name="name" th:value="${name}" required 
                   class="w-full p-3 text-center bg-gray-200 rounded-md">
        </div>

        <div class="grid grid-cols-2 gap-4 mb-4">
            <input type="text" placeholder="내국인 / 외국인" name="nationality" th:value="${nationality}" required 
                   class="w-full p-3 text-center bg-gray-200 rounded-md">
            <input type="text" placeholder="남자 / 여자" name="gender" th:value="${gender}" required 
                   class="w-full p-3 text-center bg-gray-200 rounded-md">
        </div>

        <div class="mb-4">
            <input type="email" placeholder="[선택] 이메일 주소" name="email" th:value="${email}" 
                   class="w-full p-3 text-center bg-gray-200 rounded-md">
        </div>

        <!-- 이용약관 동의 -->
        <div class="flex items-center justify-center mb-4">
            <input type="checkbox" id="agreeAll" class="mr-2">
            <label for="agreeAll" class="font-bold text-gray-700">[필수] 이용약관 전체 동의</label>
        </div>

        <!-- 버튼 -->
        <button type="submit" id="nextButton" disabled
                class="w-full h-12 bg-gray-400 text-white font-bold rounded-md cursor-not-allowed">
            다음
        </button>

        <!-- 오류 메시지 -->
        <p class="error-message text-red-500 mt-3 text-center" th:if="${error}" th:text="${error}"></p>
    </form>

    <script th:src="@{/js/calender-form.js}"></script>
</body>
</html>
