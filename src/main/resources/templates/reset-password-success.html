<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기 / 재설정</title>
    <link rel="stylesheet" th:href="@{/css/reset-password.css}" />
</head>
<body>
    <!-- 로고 이미지 -->
    <div class="logo">
        <img th:src="@{/images/icon.png}" alt="로고">
    </div>

    <div class="container">
        <!-- 비밀번호 찾기 안내 또는 비밀번호 재설정 폼 -->
        <div class="section-title">
            <h2 th:if="${username == null}">비밀번호 찾기</h2>
            <h2 th:if="${username != null}">비밀번호 재설정</h2>
            <div class="separator"></div>
        </div>
        
        <!-- 비밀번호 찾기 폼 -->
        <div th:if="${username == null}">
            <p class="description">비밀번호를 찾고자하는 아이디를 입력해주세요.</p>
            <form th:action="@{/api/calendar/resetPasswordPage}" method="post">
                <div class="input-group">
                    <input type="text" name="username" placeholder="아이디 입력" required autofocus>
                </div>
                <button type="submit" class="primary">비밀번호 재설정</button>
            </form>

            <!-- 오류 메시지 -->
            <div th:if="${error}" class="error-message alert">
                <p th:text="${error}"></p>
            </div>
        </div>

        <!-- 비밀번호 재설정 폼 -->
        <div th:if="${username != null}">
            <p class="description">새 비밀번호를 입력하고 확인을 위해 다시 입력해주세요.</p>
            <form th:action="@{/api/calendar/resetPasswordPage-success}" method="post">
                <input type="hidden" name="username" th:value="${username}" />

                <!-- 새 비밀번호 입력 -->
                <div class="input-group">
                    <label for="newPassword">새 비밀번호:</label>
                    <input type="password" id="newPassword" name="newPassword" required />
                </div>

                <!-- 비밀번호 확인 입력 -->
                <div class="input-group">
                    <label for="confirmPassword">비밀번호 확인:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required />
                </div>

                <!-- 비밀번호 변경 버튼 -->
                <button type="submit" class="submit-btn">비밀번호 변경</button>
            </form>

            <!-- 오류 메시지 -->
            <div th:if="${error}" class="error-message">
                <p th:text="${error}"></p>
            </div>
        </div>

        <!-- 버튼 그룹: 아이디 찾기, 로그인 페이지로 이동 -->
        <div class="button-group" th:if="${username == null}">
            <button onclick="window.location.href='/api/calendar/find-username'" class="primary">아이디 찾기</button>
            <button onclick="window.location.href='/api/calendar/login'" class="secondary">로그인하기</button>
        </div>
    </div>
</body>
</html>
