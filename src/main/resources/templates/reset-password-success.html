<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 재설정</title>
    <link rel="stylesheet" th:href="@{/css/reset-password.css}" />
</head>
<body>
    <!-- 로고 이미지 -->
    <div class="logo">
        <img th:src="@{/images/icon.png}" alt="로고">
    </div>

    <div class="container">
        <!-- 비밀번호 재설정 안내 -->
        <div class="section-title">
            <h2>비밀번호 재설정</h2>
            <div class="separator"></div>
        </div>
        <p class="description">새 비밀번호를 입력하고 확인을 위해 다시 입력해주세요.</p>

        <!-- 비밀번호 재설정 폼 -->
        <form th:action="@{/api/calendar/reset-password}" method="post">
            <div class="input-group">
                <input type="hidden" name="username" value="${username}" />
            </div>
            <div class="input-group">
                <input type="password" name="newPassword" placeholder="새 비밀번호" required>
            </div>
            <div class="input-group">
                <input type="password" name="confirmPassword" placeholder="새 비밀번호 확인" required>
            </div>
            <button type="submit" class="primary">비밀번호 변경</button>
        </form>

        <!-- 오류 메시지 -->
        <div th:if="${error}" class="error-message">
            <p th:text="${error}"></p>
        </div>

        <!-- 비밀번호 찾기 페이지로 돌아가기 -->
        <div class="button-group">
            <button onclick="window.location.href='/api/calendar/resetPasswordPage'" class="primary">비밀번호 찾기</button>
            <button onclick="window.location.href='/api/calendar/login'" class="secondary">로그인하기</button>
        </div>
    </div>
</body>
</html>
