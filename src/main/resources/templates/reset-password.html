<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기</title>
    <link rel="stylesheet" th:href="@{/css/reset-password.css}" />
</head>
<body>
    <!-- 로고 이미지 -->
    <div class="logo">
        <img th:src="@{/images/icon.png}" alt="로고">
    </div>

    <div class="container">
        <!-- 비밀번호 찾기 안내 -->
        <div class="section-title">
            <h2>비밀번호 찾기</h2>
            <div class="separator"></div>
        </div>
        <p class="description">비밀번호를 찾고자하는 이메일을 입력해주세요.</p>

        <!-- 비밀번호 찾기 폼 -->
        <form action="/api/calendar/process-reset-password" method="post">
            <input type="email" name="username" placeholder="이메일 입력" required>
            <button type="submit" class="primary">비밀번호 재설정</button>
        </form>

        <!-- 오류 메시지 -->
        <p class="error-message" th:if="${error}" th:text="${error}"></p>

        <!-- 아이디 찾기 페이지로 이동 -->
        <div class="button-group">
            <button onclick="window.location.href='/api/calendar/find-username'" class="primary">아이디 찾기</button>
            <button onclick="window.location.href='/api/calendar/login'" class="secondary">로그인하기</button>
        </div>
    </div>
</body>
</html>
