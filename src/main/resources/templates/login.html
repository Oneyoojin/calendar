<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>SIGN IN</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

  <div class="container">
    <h1>SIGN IN</h1>

    <ul class="links">
      <li><a href="#" id="signin" th:href="@{/signin}">SIGN IN</a></li>
      <li><a href="#" id="signup" th:href="@{/signup}">SIGN UP</a></li>
      <li><a href="#" id="reset" th:href="@{/reset}">RESET</a></li>
    </ul>

    <!-- 로그인 폼 -->
    <form action="/login" method="post">
      <div class="first-input input__block first-input__block">
         <input type="email" placeholder="Email" class="input" id="email" name="email" th:value="${email}" />
      </div>
      <div class="input__block">
         <input type="password" placeholder="Password" class="input" id="password" name="password" />
      </div>
      <button class="signin__btn" type="submit">Sign in</button>
    </form>

    <div class="separator">
      <p>OR</p>
    </div>

    <button class="google__btn">
      <i class="fa fa-google"></i> Sign in with Google
    </button>

    <button class="github__btn">
      <i class="fa fa-github"></i> Sign in with GitHub
    </button>
  </div>
</body>
</html>
