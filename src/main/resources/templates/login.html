<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>SIGN IN</title>
  
  <!-- Add any necessary CSS links here -->
  <link rel="stylesheet" href="/css/style.css" />

  <!-- Include Font Awesome for social icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  
  <!-- You can also link any other external stylesheets or JS libraries here -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> <!-- jQuery 예시 -->
  
</head>
<body>

  <div class="container">
    <!-- Heading -->
    <h1>SIGN IN</h1>
  
    <!-- Links -->
    <ul class="links">
      <li>
        <a href="#" id="signin" th:href="@{/signin}">SIGN IN</a>
      </li>
      <li>
        <a href="#" id="signup" th:href="@{/signup}">SIGN UP</a>
      </li>
      <li>
        <a href="#" id="reset" th:href="@{/reset}">RESET</a>
      </li>
    </ul>
  
    <!-- Form -->
    <form action="#" method="post" th:action="@{/login}">
      <!-- email input -->
      <div class="first-input input__block first-input__block">
         <input type="email" placeholder="Email" class="input" id="email" name="email" th:value="${email}" />
      </div>
      <!-- password input -->
      <div class="input__block">
         <input type="password" placeholder="Password" class="input" id="password" name="password" />
      </div>
      <!-- repeat password input -->
      <div class="input__block">
         <input type="password" placeholder="Repeat password" class="input repeat__password" id="repeat__password" name="repeatPassword" />
      </div>
      <!-- sign in button -->
      <button class="signin__btn" type="submit">
        Sign in
      </button>
    </form>
  
    <!-- separator -->
    <div class="separator">
      <p>OR</p>
    </div>
  
    <!-- google button -->
    <button class="google__btn">
      <i class="fa fa-google"></i>
      Sign in with Google
    </button>
  
    <!-- github button -->
    <button class="github__btn">
      <i class="fa fa-github"></i>
      Sign in with GitHub
    </button>
  </div>
</body>
</html>
