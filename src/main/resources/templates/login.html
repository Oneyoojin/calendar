<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>SIGN IN</title>
  
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <script th:src="@{/js/script.js}" defer></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>

  <div class="container">
    <h1>SIGN IN</h1>
    
    <ul class="links">
      <li>
        <a href="#" id="signin">SIGN IN</a>
      </li>
      <li>
        <a href="#" id="signup">SIGN UP</a>
      </li>
      <li>
        <a href="#" id="reset">RESET</a>
      </li>
    </ul>

    <div th:if="${param.logout}">
      <p style="color: green; font-weight: bold;">로그아웃 되었습니다.</p>
    </div>
    
    <!-- 로그인 폼 -->
    <form action="/login" method="post">
      <div class="first-input input__block">
         <input type="text" placeholder="Username" class="input" id="username" name="username" required />
      </div>
      <div class="input__block">
         <input type="password" placeholder="Password" class="input" id="password" name="password" required />
      </div>
      <div class="input__block">
         <input type="password" placeholder="Repeat Password" class="input repeat__password" id="repeat__password" />
      </div>
      <button class="signin__btn">Sign in</button>

      <div th:if="${error}" class="error-message">
        <p th:text="${error}" style="color: red; font-weight: bold;"></p>
      </div>
    </form>
    
    <div class="separator">
      <p>OR</p>
    </div>

    <!-- 구글 로그인 버튼 -->
    <a href="/oauth2/authorization/google" class="google__btn" style="display: inline-block; text-decoration: none; background-color: #4285F4; color: white; padding: 10px 20px; border-radius: 5px; text-align: center; margin-top: 10px;">
      <!-- 구글 로고 이미지 -->
      <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/Google-logo.svg" alt="Google Logo" style="width: 24px; height: 24px; margin-right: 10px; vertical-align: middle;" />
      Sign in with Google
    </a>
  </div>

</body>
</html>
