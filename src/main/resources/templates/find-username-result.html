<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>아이디 찾기 결과</title>
    <link rel="stylesheet" th:href="@{/css/find-username-result.css}" />
</head>
<body>
    <!-- 로고 이미지 추가 -->
    <div class="logo">
        <img th:src="@{/images/icon.png}" alt="로고">
    </div>

    <div class="container">
        <!-- 아이디 찾기 안내 -->
        <div class="section-title">
            <h2>아이디 찾기</h2>
            <div class="separator"></div>
        </div>
        <p class="description">고객님의 정보와 일치하는 아이디 목록입니다.</p>

        <!-- 아이디 찾기 성공 시 결과 표시 및 로그인하기 버튼 -->
        <div th:if="${foundUsername != null}">
            <p>찾은 아이디: <span th:text="${foundUsername}"></span></p>
            <div class="button-group">
                <button th:onclick="|window.location.href='/api/calendar/login'|" class="primary">로그인하기</button>
                <button th:onclick="|window.location.href='/api/calendar/reset-password'|" class="primary">비밀번호 찾기</button>
            </div>
        </div>

        <!-- 아이디 찾기 실패 시 -->
        <div th:if="${error != null}">
            <p class="error-message" th:text="${error}"></p>
        </div>
    </div>
</body>
</html>
