<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 완료</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .logo img {
            width: 250px;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen bg-gray-100">

    <div class="flex flex-col items-center mb-6">
        <div class="logo mb-4">
            <img src="/images/icon.png" alt="Calendar Logo">
        </div>
    </div>

    <div class="bg-white px-10 py-8 rounded-lg shadow-md text-center w-full max-w-lg">
        <h2 class="text-xl font-semibold text-gray-700 mb-2">
            <span th:text="${username}" class="text-blue-600 font-bold">사용자</span> 님, 아이디입니다.
        </h2>
        <p class="text-gray-500">회원가입을 축하드립니다.</p>

        <a th:href="@{/api/calendar/login}" class="mt-6 inline-block w-full max-w-xs px-6 py-3 bg-blue-500 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 transition">
            시작하기
        </a>
    </div>

</body>
</html>
