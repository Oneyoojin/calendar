<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경 성공</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .logo img {
            width: 250px;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen bg-gray-100">

    <div class="flex flex-col items-center mb-6">
        <div class="logo mb-4">
            <img src="/images/icon.png" alt="Calendar Logo">
        </div>
    </div>

    <div class="bg-white px-10 py-8 rounded-lg shadow-md text-center w-full max-w-lg">
        <h1 class="text-2xl font-semibold text-gray-700 mb-2">비밀번호가 성공적으로 변경되었습니다!</h1>

        <p class="text-gray-500 mb-4" th:text="${message}">지금부터 기능을 사용할 수 있습니다.</p>
        <!-- 사용자 이름 표시 (username을 모델로 전달할 경우) -->
        <p class="text-gray-500 mb-4" th:if="${username != null}" th:text="'사용자: ' + ${username}">사용자 이름</p>

        <a href="/api/calendar/login" class="mt-6 inline-block w-full max-w-xs px-6 py-3 bg-blue-500 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 transition">
            로그인 페이지로 돌아가기
        </a>
    </div>

</body>
</html>
