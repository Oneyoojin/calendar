<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 완료</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .logo img {
            width: 250px;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen bg-gray-100">

    <div class="flex flex-col items-center mb-6">
        <div class="logo mb-4">
            <img src="/images/icon.png" alt="Calendar Logo">
        </div>
    </div>

    <div class="bg-white px-10 py-8 rounded-lg shadow-md text-center w-full max-w-lg">
        <h2 class="text-xl font-semibold text-gray-700 mb-2">
            <span th:text="${username}" class="text-blue-600 font-bold" th:if="${username != null}">사용자</span>
            <span th:text="${error}" class="text-red-600 font-bold" th:if="${error != null}">일치하는 아이디가 없습니다.</span>
        </h2>
        
        <!-- 아이디가 존재하는 경우 '기능을 사용할 수 있습니다' 메시지 표시 -->
        <p class="text-gray-500" th:if="${username != null}">지금부터 기능을 사용할 수 있습니다.</p>

        <!-- 에러 메시지가 존재하는 경우, 에러를 표시 -->
        <p class="text-red-500 mt-4" th:if="${error != null}">다시 시도해주세요.</p>

        <!-- 로그인 페이지로 이동하는 버튼 -->
        <a th:href="@{/api/calendar/login}" class="mt-6 inline-block w-full max-w-xs px-6 py-3 bg-blue-500 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 transition">
            시작하기
        </a>
    </div>

</body>
</html>
