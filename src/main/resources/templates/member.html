<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Tasks</title>
    <link rel="stylesheet" th:href="@{/css/member.css}">
    <link rel="stylesheet" th:href="@{/css/task-modal.css}">
    <script th:src="@{/js/member.js}" defer></script>
</head>
<body>

    <!-- 오른쪽 상단 버튼 -->
    <div class="top-right-buttons">
        <div class="toggle-switch">
            <button class="calendar-btn active">
                <img th:src="@{/images/Icons_Baustein_Datum.svg}" style="width: 25px; height: auto;">
            </button>
            <button class="tasks-btn">
                <img th:src="@{/images/free-icon-check-1292834.png}" style="width: 20px; height: auto;">
            </button>
        </div>
        <!-- 점 6개 메뉴 아이콘 -->
        <div class="dot-menu">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
        </div>
    </div>

    <div class="sidebar">
        <h2>
            <img th:src="@{/images/icon.png}" alt="Calendar Icon" class="logo" style="width: 220px; height: auto;"> 
        </h2>
        <div class="sidebar-content"> 
            <button class="create-btn" onclick="openModal()">+ 만들기</button>
            <ul class="task-lists">
                <li class="active">✔ 모든 할 일</li>
                <li> ⭐ 별표 표시됨</li>
                <li id="today-tasks"> 📋 오늘의 할 일</li> <!-- 새로운 할 일이 추가될 영역 -->
                <li> ➕ 새 목록 만들기</li>
            </ul>
        </div>
    </div>

    <div class="main-content">
        <div id="taskBoard" class="task-board">
            <!-- 동적으로 할 일이 추가될 영역 -->
        </div>
    </div>

    <!-- 모달 창 -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <input type="text" id="taskTitle" placeholder="제목 추가" class="title-input">

            <div class="date-time">
                <button class="icon-btn">
                    <i class="fa-solid fa-hourglass-start"></i>
                </button>
                <input type="date" id="taskDate">
                <input type="time" id="taskTime">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="allDay">
                <label for="allDay">종일</label>
            </div>

            <select id="repeatSelect">
                <option>반복 안함</option>
                <option>매일</option>
                <option>매주</option>
                <option>매월</option>
            </select>

            <textarea id="taskDescription" placeholder="설명 추가"></textarea>

            <select id="taskList">
                <option>내 할 일 목록1</option>
                <option>내 할 일 목록2</option>
            </select>

            <button class="save-btn" onclick="saveTask()" disabled>저장</button>
        </div>
    </div>

    <script th:src="@{/js/task-modal.js}" defer></script>
</body>
</html>
