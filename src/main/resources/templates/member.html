<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Tasks</title>
    <link rel="stylesheet" th:href="@{/css/member.css}">
    <link rel="stylesheet" th:href="@{/css/task-modal.css}">
    <link rel="stylesheet" th:href="@{/css/title-modal.css}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <script th:src="@{/js/task-modal.js}" defer></script>
    <script th:src="@{/js/title-modal.js}" defer></script>
    <script th:src="@{/js/member.js}" defer></script>
</head>
<body>
    <div class="top-right-buttons">
        <div class="toggle-switch">
            <button class="calendar-btn active">
                <img th:src="@{/images/Icons_Baustein_Datum.svg}" style="width: 25px; height: auto;">
            </button>
            <button class="tasks-btn">
                <img th:src="@{/images/free-icon-check-1292834.png}" style="width: 20px; height: auto;">
            </button>
        </div>
        <img th:src="@{/images/free-icon-menu-1237932.png}" style="width: 20px; height: auto;">
    </div>

    <div class="sidebar">
        <h2>
            <img th:src="@{/images/icon.png}" alt="Calendar Icon" class="logo" style="width: 220px; height: auto;">
        </h2>
        <div class="sidebar-content">
            <!-- ✅ "만들기" 버튼 -->
            <button class="create-btn" onclick="openModal()">+ 만들기</button>
            <ul class="task-lists">
                <li class="active">✔ 모든 할 일</li>
                <li> ⭐ 별표 표시됨</li>
                <li id="today-tasks"> 오늘의 할 일</li>
                <!-- ✅ "새 목록 만들기" 버튼 -->
                <li onclick="openTitleModal()"> ➕ 새 목록 만들기</li>
            </ul>
        </div>
    </div>

    <div class="main-content">
        <div id="taskBoard" class="task-board"></div>
    </div>

    <!-- ✅ "만들기" 모달 -->
    <div id="taskModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3>새 할 일 만들기</h3>
            <input type="text" id="taskTitle" placeholder="제목 추가" class="title-input">
            <div class="date-time">
                <input type="date" id="taskDate">
                <input type="time" id="taskTime">
            </div>
            <textarea id="taskDescription" placeholder="설명 추가"></textarea>
            <button id="confirmTaskButton" class="save-btn" onclick="saveTask()">저장</button>
        </div>
    </div>

    <!-- ✅ "새 목록 만들기" 모달 -->
    <div id="titleModal" class="title-modal" style="display: none;">
        <div class="title-modal-content">
            <h3>새 목록 만들기</h3>
            <input type="text" id="listTitle" placeholder="이름 입력">
            <div class="title-modal-buttons">
                <button onclick="closeTitleModal()">취소</button>
                <button id="confirmTitleButton" onclick="createList()" disabled>완료</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const taskModal = document.getElementById("taskModal");
            const titleModal = document.getElementById("titleModal");

            const taskTitleInput = document.getElementById("taskTitle");
            const confirmTaskButton = document.getElementById("confirmTaskButton");

            const listTitleInput = document.getElementById("listTitle");
            const confirmTitleButton = document.getElementById("confirmTitleButton");

            /* ✅ "만들기" 모달 기능 */
            window.openModal = function () {
                taskModal.style.display = "flex";
            };

            window.closeModal = function () {
                taskModal.style.display = "none";
                taskTitleInput.value = "";
                confirmTaskButton.disabled = true;
            };

            /* ✅ "새 목록 만들기" 모달 기능 */
            window.openTitleModal = function () {
                titleModal.style.display = "flex";
            };

            window.closeTitleModal = function () {
                titleModal.style.display = "none";
                listTitleInput.value = "";
                confirmTitleButton.disabled = true;
            };

            /* ✅ 입력 감지 후 버튼 활성화 */
            taskTitleInput.addEventListener("input", function () {
                confirmTaskButton.disabled = taskTitleInput.value.trim() === "";
            });

            listTitleInput.addEventListener("input", function () {
                confirmTitleButton.disabled = listTitleInput.value.trim() === "";
            });

            /* ✅ "완료" 클릭 시 새 목록 추가 */
            window.createList = function () {
                const listTitle = listTitleInput.value.trim();
                if (listTitle === "") return;

                console.log("✅ 새 목록 추가됨:", listTitle);

                const taskLists = document.querySelector(".task-lists");
                const newListItem = document.createElement("li");
                newListItem.textContent = listTitle;
                taskLists.appendChild(newListItem);

                closeTitleModal();
            };
        });
    </script>
</body>
</html>
