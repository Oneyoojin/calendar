<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Tasks</title>
    <link rel="stylesheet" th:href="@{/css/member.css}">
    <link rel="stylesheet" th:href="@{/css/task-modal.css}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <script th:src="@{/js/index.js}" defer></script>
    <script th:src="@{/js/task-modal.js}" defer></script>
    <script th:src="@{/js/member.js}" defer></script>
</head>
<body>

    <!-- 오른쪽 상단 버튼 -->
    <div class="top-right-buttons">
        <div class="toggle-switch">
            <button class="calendar-btn active">
                <img th:src="@{/images/Icons_Baustein_Datum.svg}" style="width: 25px; height: auto;">
            </button>
            <button class="tasks-btn">
                <img th:src="@{/images/free-icon-check-1292834.png}" style="width: 20px; height: auto;">
            </button>
        </div>
        <img th:src="@{/images/free-icon-menu-1237932.png}" style="width: 20px; height: auto;">
    </div>

    <div class="sidebar">
        <h2>
            <img th:src="@{/images/icon.png}" alt="Calendar Icon" class="logo" style="width: 220px; height: auto;"> 
        </h2>
        <div class="sidebar-content"> 
            <button class="create-btn" onclick="openModal()">+ 만들기</button>
            <ul class="task-lists">
                <li class="active">✔ 모든 할 일</li>
                <li> ⭐ 별표 표시됨</li>
                <li id="today-tasks"> 오늘의 할 일</li>
                <li> ➕ 새 목록 만들기</li>
            </ul>
        </div>
    </div>

    <div class="main-content">
        <div id="taskBoard" class="task-board">
            <!-- 동적으로 할 일이 추가될 영역 -->
        </div>
    </div>

    <!-- ✅ 점 3개 클릭 시 나타나는 정렬 메뉴 -->
    <div id="taskMenuModal" style="display: none; position: absolute; z-index: 1000; background: white; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2); border-radius: 8px; padding: 8px 0; font-size: 14px; color: #333;">
        <ul class="task-menu">
            <li class="selected">✔ 내가 정렬한 대로</li>
            <li>날짜</li>
            <li>최근 별표표시한 항목</li>
            <hr>
            <li>목록 이름 변경</li>
            <li class="disabled">목록 삭제 <span>기본 목록은 삭제할 수 없음</span></li>
            <hr>
            <li>목록 인쇄</li>
            <li>완료된 할 일 모두 삭제</li>
            <li class="disabled">오래된 할 일 정리</li>
        </ul>
    </div>

    <!-- 모달 창 -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <input type="text" id="taskTitle" placeholder="제목 추가" class="title-input">

            <div class="date-time">
                <button class="icon-btn">
                    <i class="fa-solid fa-hourglass-start"></i>
                </button>
                <input type="date" id="taskDate">
                <input type="time" id="taskTime">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="allDay">
                <label for="allDay">종일</label>
            </div>

            <select id="repeatSelect">
                <option>반복 안함</option>
                <option>매일</option>
                <option>매주</option>
                <option>매월</option>
            </select>

            <textarea id="taskDescription" placeholder="설명 추가"></textarea>

            <select id="taskList">
                <option>내 할 일 목록1</option>
                <option>내 할 일 목록2</option>
            </select>

            <button class="save-btn" onclick="saveTask()">저장</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const taskBoard = document.getElementById("taskBoard");
            const taskMenuModal = document.getElementById("taskMenuModal");

            // ✅ 점 3개 클릭 시 메뉴 표시
            document.addEventListener("click", function (event) {
                if (event.target.classList.contains("dot-icon")) {
                    event.stopPropagation();

                    const dotMenu = event.target.closest(".dot-menu");
                    const rect = dotMenu.getBoundingClientRect();

                    taskMenuModal.style.top = `${rect.bottom + window.scrollY}px`;
                    taskMenuModal.style.left = `${rect.left}px`;
                    taskMenuModal.style.display = "block";
                } else {
                    if (!taskMenuModal.contains(event.target)) {
                        taskMenuModal.style.display = "none";
                    }
                }
            });

            // ✅ 카드 추가 기능 (이미지 포함)
            window.saveTask = function () {
                const title = document.getElementById("taskTitle").value.trim();
                if (!title) {
                    alert("제목을 입력하세요!");
                    return;
                }

                const newTask = document.createElement("div");
                newTask.classList.add("task-card");
                newTask.innerHTML = `
                    <h3>${title}</h3>
                    <div class="dot-menu">
                        <img src="/images/free-icon-three-dot-menu-17399989.png" class="dot-icon">
                    </div>
                    <p>📌 알림: ${document.getElementById("taskDate").value}</p>
                    <p class="description">${document.getElementById("taskDescription").value}</p>
                    <img src="/images/Pngtree-up-down-arrow-number_4706662.png" 
                         alt="Up Down Arrows" 
                         class="up-down-icon"
                         style="width: 20px; height: auto;">
                `;

                taskBoard.appendChild(newTask);
                newTask.style.display = "block";

                // ✅ 추가된 카드의 점 3개 이벤트 핸들러
                newTask.querySelector(".dot-icon").addEventListener("click", function (event) {
                    event.stopPropagation();
                    const rect = this.getBoundingClientRect();
                    taskMenuModal.style.top = `${rect.bottom + window.scrollY}px`;
                    taskMenuModal.style.left = `${rect.left}px`;
                    taskMenuModal.style.display = "block";
                });

                document.getElementById("taskModal").style.display = "none";
            };
        });
    </script>

</body>
</html>
