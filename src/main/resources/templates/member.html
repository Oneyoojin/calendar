<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Tasks</title>
    <link rel="stylesheet" th:href="@{/css/member.css}">
</head>
<body>
    <div class="sidebar">
        <h2><img src="@{/images/icon.png}" alt="Calendar Icon" class="logo"></h2>
        <button class="create-btn">+ 만들기</button>
        <ul class="task-lists">
            <li class="active">✔ 모든 할 일</li>
            <li> ⭐ 별표 표시됨</li>
            <li> 📋 내 할 일 목록1</li>
            <li> 📋 내 할 일 목록2</li>
            <li> ➕ 새 목록 만들기</li>
        </ul>
    </div>
    <div class="main-content">
        <div class="task-board">
            <div class="task-card">
                <h3>내 할 일 목록1</h3>
                <a href="#" class="add-task">➕ 할 일 추가</a>
                <p>📌 알림 <span class="alert">1주 전</span></p>
                <p class="completed">✔ 완료됨 (3개)</p>
            </div>
            <div class="task-card">
                <h3>내 할 일 목록2</h3>
                <a href="#" class="add-task">➕ 할 일 추가</a>
                <p class="empty">아직 할 일 없음</p>
                <p class="description">할 일을 추가하고 관리하세요.</p>
            </div>
        </div>
    </div>
</body>
</html>
