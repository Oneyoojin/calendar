# Spring Boot 애플리케이션 이름 설정
spring.application.name=calendar

# MariaDB 연결 설정
spring.datasource.url=jdbc:mariadb://localhost:3306/  # MariaDB 데이터베이스 URL
spring.datasource.username=root                      # MariaDB 사용자명
spring.datasource.password=1234                      # MariaDB 비밀번호
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver # MariaDB JDBC 드라이버

# Hibernate 설정 (JPA 사용 시)
spring.jpa.hibernate.ddl-auto=update  # Hibernate가 DB 스키마를 자동으로 업데이트하도록 설정
spring.jpa.properties.hibernate.format_sql=true  # SQL 포맷팅을 활성화
spring.jpa.show-sql=true  # 실행되는 SQL을 콘솔에 출력

# Thymeleaf 캐시 비활성화 (개발 중에 템플릿 변경을 바로 반영하려면 비활성화)
spring.thymeleaf.cache=false

# 파일 업로드 설정
spring.servlet.multipart.enabled=true  # 파일 업로드 기능 활성화
spring.servlet.multipart.localhost=/Users/yourusername/upload
spring.servlet.multipart.max-request-size=30MB  # 요청의 최대 크기 (파일 포함)
spring.servlet.multipart.max-file-size=10MB  # 개별 파일의 최대 크기

# 로깅 설정 (디버그 수준)
logging.level.org.springframework.security.web=debug  # Spring Security 관련 디버그 로깅
logging.level.org.zerock.security=debug  # 사용자 정의 보안 로깅 (이 설정은 예시일 수 있음)
